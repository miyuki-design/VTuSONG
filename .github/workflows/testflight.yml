name: VTuSONG iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build web source
        env:
          VITE_API_BASE_URL: ${{ vars.VTUSONG_AI_URL }}
        run: npm run build

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp public/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Set up certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v7
        with:
          bundle-id: com.miyukidesign.vtusong
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # Provisioning profile must be applied ONLY to the App target,
      # never to Capacitor / CocoaPods targets.
      - name: Configure signing for App target only
        env:
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'App target not found' unless app

          release = app.build_configurations.find { |config| config.name == 'Release' }
          abort 'App Release configuration not found' unless release

          settings = release.build_settings
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
          settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.miyukidesign.vtusong'
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
          settings['PROVISIONING_PROFILE_SPECIFIER'] = 'AppStore com.miyukidesign.vtusong'

          project.root_object.attributes['TargetAttributes'] ||= {}
          project.root_object.attributes['TargetAttributes'][app.uuid] ||= {}
          project.root_object.attributes['TargetAttributes'][app.uuid]['ProvisioningStyle'] = 'Manual'
          project.save
          puts 'Configured Apple Distribution signing for the App Release target only.'
          RUBY

      - name: Create export settings
        env:
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
        run: python3 scripts/export_options.py

      - name: Archive and export IPA
        id: build
        uses: Apple-Actions/xcodebuild@v1
        with:
          workspace: ios/App/App.xcworkspace
          scheme: App
          sdk: iphoneos
          action: archive
          archive-path: .build/Archives/VTuSONG.xcarchive
          export-options-plist: .build/ExportOptions.plist
          build-number: ${{ github.run_number }}

      - name: Upload TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.build.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
